services:
  - type: web
    name: job-copilot-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -m spacy download en_core_web_sm
    # The public demo is database-free: the frontend runs in forced demo mode and
    # only ever calls /api/extract (stateless, no DB). So the backend is deployed
    # as a pure extraction service with no database and no migration step. This
    # keeps the deployment free forever (no expiring managed database to maintain).
    startCommand: sh -c "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: PYTHONPATH
        value: /opt/render/project/src/backend

  - type: web
    name: job-copilot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      # Forces the public deployment into read-only demo mode: all writes stay in
      # the visitor's browser (sessionStorage) and never reach the database.
      - key: VITE_FORCE_DEMO
        value: "true"
